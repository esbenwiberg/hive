# Autonomous pipeline configuration
# Controls routing, gating, budgets, and enrichment behaviour.

classification:
  # Default task type when the router cannot determine one
  defaultType: improvement
  # Default size estimate when unknown
  defaultSize: medium

gate:
  # Mode: "ai" (LLM decides), "human" (always require approval), "auto" (skip gate)
  mode: human

budget:
  # Default daily budget per user in USD
  dailyDefault: 100.00
  # Maximum spend allowed for a single task in USD
  perTaskMax: 25.00

clarification:
  mode: human

models:
  # ── Global defaults ─────────────────────────────────────────────────────────
  # Used by every component that does NOT have a per-component override below.
  default: claude-sonnet-4-6
  inputCostPerM: 3
  outputCostPerM: 15

  # ── Simple per-component model names (Anthropic direct, legacy format) ──────
  # These are used when no per-component provider block overrides the component.
  components:
    router: claude-haiku-4-5-20251001          # classification — fast & cheap
    scorer: claude-haiku-4-5-20251001          # numeric scoring — fast & cheap
    gate: claude-sonnet-4-6           # approval decisions — needs judgment
    worker: claude-opus-4-6           # code implementation — heavy lifting
    decomposer: claude-sonnet-4-6     # epic breakdown — reasoning
    refiner: claude-sonnet-4-6        # task refinement
    clarification: claude-haiku-4-5-20251001   # generating questions — lightweight
    keeper: claude-haiku-4-5-20251001          # knowledge management — lightweight
    retrospective: claude-sonnet-4-6  # post-task analysis
    feedback-loop: claude-haiku-4-5-20251001   # feedback processing — lightweight
    code-quality-analyst: claude-sonnet-4-6  # code review needs judgment
    gate-analyst: claude-haiku-4-5-20251001    # pattern analysis — lightweight
    browser-validator: claude-sonnet-4-6  # UI validation
    milestone-review: claude-sonnet-4-6  # milestone diff review — classification
    milestone-fix: claude-sonnet-4-6     # milestone fix loop — agentic
    review-gate: claude-sonnet-4-6    # code review — quality critical
    architect: claude-sonnet-4-6      # architecture design
    producer: claude-haiku-4-5-20251001        # task discovery — lightweight

  # ── Per-component provider overrides ────────────────────────────────────────
  # Each key matches a ComponentName.  When present, this block takes full
  # precedence over the simple `components.<name>` string above.
  #
  # Supported provider types:
  #   anthropic       — Anthropic public API (apiKey optional; falls back to
  #                     ANTHROPIC_API_KEY env var)
  #   azure-openai    — Azure AI Foundry, OpenAI-compatible endpoint
  #                     (GPT-4o, GPT-4.1, o-series, …)
  #   azure-anthropic — Anthropic model hosted on Azure AI Foundry
  #
  # Required fields for azure-openai / azure-anthropic:
  #   endpoint       — e.g. https://<resource>.openai.azure.com
  #   deploymentName — deployment / model name in the Foundry project
  #   apiKey         — Azure AI Foundry API key
  #
  # Example overrides (all commented out — uncomment and fill in to activate):
  #
  # componentProviders:
  #
  #   # Route review-gate to a cheap Haiku deployment on Anthropic directly
  #   review-gate:
  #     type: anthropic
  #     model: claude-haiku-4-5-20251001
  #     # apiKey: sk-ant-...   # optional; omit to use ANTHROPIC_API_KEY env var
  #
  #   # Use an Azure-hosted GPT model for the worker (heavy lifting)
  #   worker:
  #     type: azure-openai
  #     endpoint: https://my-resource.openai.azure.com
  #     deploymentName: gpt-4o-deployment
  #     apiKey: AZURE_OPENAI_API_KEY_PLACEHOLDER
  #     model: gpt-4o
  #
  #   # Use an Anthropic model via Azure AI Foundry for the router
  #   router:
  #     type: azure-anthropic
  #     endpoint: https://my-foundry.services.ai.azure.com
  #     deploymentName: claude-haiku-foundry
  #     apiKey: AZURE_FOUNDRY_API_KEY_PLACEHOLDER
  #     model: claude-haiku-4-5-20251001
  #
  #   # Decomposer with a specific Sonnet deployment on Azure
  #   decomposer:
  #     type: azure-openai
  #     endpoint: https://my-resource.openai.azure.com
  #     deploymentName: gpt-4-1-deployment
  #     apiKey: AZURE_OPENAI_API_KEY_PLACEHOLDER
  #     model: gpt-4.1
  #
  #   # Gate using Azure-hosted Anthropic Sonnet
  #   gate:
  #     type: azure-anthropic
  #     endpoint: https://my-foundry.services.ai.azure.com
  #     deploymentName: claude-sonnet-foundry
  #     apiKey: AZURE_FOUNDRY_API_KEY_PLACEHOLDER
  #     model: claude-sonnet-4-6
  #
  #   # Enricher using Anthropic direct
  #   enricher:
  #     type: anthropic
  #     model: claude-sonnet-4-6
  #
  #   # Milestone-review via Azure OpenAI
  #   milestone-review:
  #     type: azure-openai
  #     endpoint: https://my-resource.openai.azure.com
  #     deploymentName: gpt-4o-mini-deployment
  #     apiKey: AZURE_OPENAI_API_KEY_PLACEHOLDER
  #     model: gpt-4o-mini
  #
  #   # Producer using the cheapest Azure OpenAI option
  #   producer:
  #     type: azure-openai
  #     endpoint: https://my-resource.openai.azure.com
  #     deploymentName: gpt-35-turbo-deployment
  #     apiKey: AZURE_OPENAI_API_KEY_PLACEHOLDER
  #     model: gpt-35-turbo

enrichers:
  - name: codebase
    enabled: true
  - name: docs
    enabled: true
  - name: git-history
    enabled: true
  - name: dependencies
    enabled: true
  - name: architect
    enabled: true
  - name: scorer
    enabled: true

preview:
  # Whether preview environments are enabled
  enabled: true
  # Maximum number of concurrent preview environments
  max_concurrent: 3
  # Minutes before an idle preview is cleaned up
  cleanup_timeout_minutes: 30
  # Docker host configuration for remote Docker
  docker_host:
    ip: "20.107.218.135"
    port: 2376
    tls_cert_vault_secret: docker-tls-cert
    tls_key_vault_secret: docker-tls-key
    tls_ca_vault_secret: docker-tls-ca
    ssh_key_vault_secret: docker-ssh-key
    ssh_user: hiveadmin
  # Seconds to wait for docker compose up (image pull + build)
  compose_up_timeout_seconds: 300
  # Port range for preview environments [start, end]
  port_range: [4001, 4099]
