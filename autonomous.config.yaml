# Default LLM provider for all components
# Can be overridden per-component in componentProviders below
defaultProvider:
  type: anthropic
  modelId: claude-3-5-sonnet-20241022
  apiKeyEnv: ANTHROPIC_API_KEY

# Per-component provider configuration
# Valid component names: router, gate, decomposer, pipeline, worker, review-gate, milestone-review, base-producer
componentProviders:
  # Example: Use Azure OpenAI for worker
  # Uncomment and fill in your values:
  # worker:
  #   type: azure-openai
  #   modelId: gpt-4-turbo
  #   apiKeyEnv: AZURE_OPENAI_API_KEY
  #   endpoint: https://your-resource.openai.azure.com/
  #   deploymentName: your-deployment-name

  # Example: Use Azure Anthropic (Foundry) for code review
  # Uncomment and fill in your values:
  # review-gate:
  #   type: azure-anthropic
  #   modelId: claude-3-haiku-20242022
  #   apiKeyEnv: AZURE_FOUNDRY_API_KEY
  #   endpoint: https://api.foundry.microsoft.com/
  #   deploymentName: your-deployment-name

# ── Classification ────────────────────────────────────────────────────────
# Which task types the system will automatically route and execute.
classification:
  enabled: true
  allowedTypes:
    - bug
    - feature
    - security
    - refactor
    - improvement

# ── Gating ────────────────────────────────────────────────────────────────
# Cost, complexity, and risk thresholds before human approval is required.
gating:
  enabled: true
  maxTaskCostUsd: 100.00
  maxTaskTokens: 500000
  requireApprovalForRisks:
    - security-sensitive-files
    - large-change-surface-area
    - breaking-public-apis

# ── Enrichment ────────────────────────────────────────────────────────────
# Repository context ingestion (codebase summaries, docs, test snapshots).
enrichment:
  enabled: true
  maxRepoCacheAgeDays: 7
  maxSummaryTokens: 50000

# ── Execution ─────────────────────────────────────────────────────────────
# Orchestration and safety limits for task execution.
execution:
  maxReworkCycles: 3
  maxExecutionTimeMinutes: 60
  concurrencyLimit: 5
  requireMilestoneReview: true
  previewDeploymentEnabled: true

# ── Producers ─────────────────────────────────────────────────────────────
# Autonomous task generation from signals (logs, scans, etc).
producers:
  enabled: false
  interval: 3600
  types: []
