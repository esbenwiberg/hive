services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: hive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://hive:hive@postgres:5432/hive
      SESSION_SECRET: dev-secret-change-me
      NODE_ENV: development
      ENTRA_CLIENT_ID:
      ENTRA_CLIENT_SECRET:
      ENTRA_TENANT_ID:

volumes:
  pgdata:
